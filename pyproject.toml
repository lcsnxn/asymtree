[build-system]
requires = ["setuptools>=64", "numpy>=1.21,<2"]
build-backend = "setuptools.build_meta"

[project]
name = "asymtree"
version = "0.1.7"
description = "Decision tree classifier with centroid-asymmetry split criterion"
readme = "README.md"
license = "MIT"
authors = [{ name = "Lucas Xavier", email = "lucas.nqxavier@gmail.com" }]
requires-python = ">=3.9"
dependencies = [
    "numpy>=1.21",
    "scikit-learn>=1.4",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Mathematics",
]

[project.urls]
Homepage = "https://github.com/lcsnxn/asymtree"
Issues = "https://github.com/lcsnxn/asymtree/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["asymtree*"]
